<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrabble Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1209;
    --wood: #3d2b1f;
    --wood-light: #5c3d2e;
    --cream: #f5ead8;
    --tile: #f0d99a;
    --tile-shadow: #c9a84c;
    --tile-dark: #8b6914;
    --accent: #c0392b;
    --green: #27ae60;
    --text: #2c1a0e;
    --border: #7a5c3a;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background-color: var(–bg);
background-image:
repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 40px),
repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 40px);
min-height: 100vh;
font-family: ‘Crimson Text’, serif;
color: var(–cream);
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}

h1 {
font-family: ‘Playfair Display’, serif;
font-size: clamp(2rem, 6vw, 3.5rem);
font-weight: 900;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–tile);
text-shadow: 3px 3px 0 var(–tile-dark), 0 0 40px rgba(192,160,80,.3);
margin-bottom: 6px;
}

.subtitle {
font-family: ‘Crimson Text’, serif;
font-style: italic;
font-size: 1.1rem;
color: rgba(245,234,216,.5);
letter-spacing: 0.2em;
margin-bottom: 28px;
}

/* SETUP SCREEN */
#setup-screen {
width: 100%;
max-width: 500px;
}

.setup-card {
background: var(–wood);
border: 2px solid var(–border);
border-radius: 4px;
padding: 28px 32px;
box-shadow: 0 8px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
}

.setup-card h2 {
font-family: ‘Playfair Display’, serif;
font-size: 1.4rem;
color: var(–tile);
margin-bottom: 20px;
text-align: center;
letter-spacing: 0.08em;
}

.order-list {
list-style: none;
display: flex;
flex-direction: column;
gap: 10px;
margin-bottom: 24px;
}

.order-item {
display: flex;
align-items: center;
gap: 14px;
background: rgba(0,0,0,.25);
border: 1px solid rgba(122,92,58,.4);
border-radius: 3px;
padding: 10px 14px;
cursor: grab;
user-select: none;
transition: background .15s, transform .15s;
}

.order-item:active { cursor: grabbing; transform: scale(1.02); }
.order-item.drag-over { border-color: var(–tile); background: rgba(192,160,80,.15); }

.order-num {
font-family: ‘Playfair Display’, serif;
font-size: 1.4rem;
font-weight: 700;
color: var(–tile-shadow);
width: 28px;
text-align: center;
flex-shrink: 0;
}

.order-name {
font-size: 1.2rem;
font-weight: 600;
color: var(–cream);
flex: 1;
}

.drag-hint {
font-size: 0.85rem;
color: rgba(245,234,216,.35);
text-align: center;
margin-bottom: 20px;
font-style: italic;
}

.btn-start {
width: 100%;
background: var(–tile);
color: var(–text);
border: none;
border-radius: 3px;
padding: 14px;
font-family: ‘Playfair Display’, serif;
font-size: 1.1rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
cursor: pointer;
box-shadow: 0 4px 0 var(–tile-dark);
transition: transform .1s, box-shadow .1s;
}

.btn-start:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(–tile-dark); }
.btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 var(–tile-dark); }

/* GAME SCREEN */
#game-screen { width: 100%; max-width: 860px; display: none; }

.scoreboard {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
gap: 14px;
margin-bottom: 20px;
}

.player-card {
background: var(–wood);
border: 2px solid var(–border);
border-radius: 4px;
padding: 16px;
position: relative;
box-shadow: 0 4px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
transition: border-color .2s;
}

.player-card.active-turn {
border-color: var(–tile);
box-shadow: 0 4px 20px rgba(192,160,80,.35), inset 0 1px 0 rgba(255,255,255,.06);
}

.player-card.active-turn::before {
content: ‘▶ TURN’;
position: absolute;
top: -11px;
left: 50%;
transform: translateX(-50%);
background: var(–tile);
color: var(–text);
font-family: ‘Playfair Display’, serif;
font-size: 0.65rem;
font-weight: 700;
letter-spacing: 0.15em;
padding: 2px 10px;
border-radius: 2px;
}

.turn-order-badge {
position: absolute;
top: 10px;
right: 10px;
width: 22px;
height: 22px;
background: rgba(0,0,0,.3);
border: 1px solid rgba(122,92,58,.5);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-family: ‘Playfair Display’, serif;
font-size: 0.75rem;
color: var(–tile-shadow);
}

.player-name {
font-family: ‘Playfair Display’, serif;
font-size: 1.3rem;
font-weight: 700;
color: var(–tile);
margin-bottom: 6px;
padding-right: 28px;
}

.player-total {
font-family: ‘Playfair Display’, serif;
font-size: 2.8rem;
font-weight: 900;
color: var(–cream);
line-height: 1;
margin-bottom: 12px;
}

.score-history {
max-height: 120px;
overflow-y: auto;
margin-bottom: 12px;
scrollbar-width: thin;
scrollbar-color: var(–border) transparent;
}

.score-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 3px 0;
border-bottom: 1px solid rgba(122,92,58,.2);
font-size: 0.9rem;
color: rgba(245,234,216,.7);
}

.score-row .rnd { color: rgba(245,234,216,.4); font-size: 0.8rem; }
.score-row .pts { font-weight: 600; }
.score-row .pts.positive { color: var(–green); }
.score-row .pts.negative { color: var(–accent); }

.score-row .undo-btn {
background: none;
border: none;
color: rgba(245,234,216,.25);
cursor: pointer;
font-size: 0.75rem;
padding: 0 2px;
transition: color .15s;
line-height: 1;
}
.score-row .undo-btn:hover { color: var(–accent); }

/* Score input area */
.input-area {
background: var(–wood);
border: 2px solid var(–border);
border-radius: 4px;
padding: 20px 24px;
margin-bottom: 16px;
box-shadow: 0 4px 16px rgba(0,0,0,.4);
}

.input-area h3 {
font-family: ‘Playfair Display’, serif;
font-size: 1rem;
color: var(–tile-shadow);
letter-spacing: 0.1em;
text-transform: uppercase;
margin-bottom: 14px;
}

.input-row {
display: flex;
gap: 10px;
align-items: flex-end;
flex-wrap: wrap;
}

.input-group {
display: flex;
flex-direction: column;
gap: 5px;
flex: 1;
min-width: 120px;
}

.input-group label {
font-size: 0.85rem;
color: rgba(245,234,216,.5);
letter-spacing: 0.06em;
}

.score-input {
background: rgba(0,0,0,.35);
border: 1px solid var(–border);
border-radius: 3px;
color: var(–cream);
font-family: ‘Playfair Display’, serif;
font-size: 1.5rem;
font-weight: 700;
padding: 8px 12px;
width: 100%;
text-align: center;
outline: none;
transition: border-color .15s;
-moz-appearance: textfield;
}
.score-input::-webkit-outer-spin-button,
.score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-input:focus { border-color: var(–tile); }

.btn-add {
background: var(–tile);
color: var(–text);
border: none;
border-radius: 3px;
padding: 10px 22px;
font-family: ‘Playfair Display’, serif;
font-size: 1rem;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
cursor: pointer;
box-shadow: 0 3px 0 var(–tile-dark);
transition: transform .1s, box-shadow .1s;
white-space: nowrap;
align-self: flex-end;
}
.btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(–tile-dark); }
.btn-add:active { transform: translateY(1px); box-shadow: 0 1px 0 var(–tile-dark); }

/* Controls bar */
.controls {
display: flex;
gap: 10px;
flex-wrap: wrap;
justify-content: center;
margin-bottom: 16px;
}

.btn-secondary {
background: transparent;
border: 1px solid var(–border);
color: rgba(245,234,216,.65);
border-radius: 3px;
padding: 8px 18px;
font-family: ‘Crimson Text’, serif;
font-size: 0.95rem;
letter-spacing: 0.06em;
cursor: pointer;
transition: border-color .15s, color .15s;
}
.btn-secondary:hover { border-color: var(–tile-shadow); color: var(–cream); }

.btn-danger {
border-color: rgba(192,57,43,.5);
color: rgba(192,57,43,.7);
}
.btn-danger:hover { border-color: var(–accent); color: var(–accent); }

/* Round indicator */
.round-bar {
text-align: center;
font-family: ‘Playfair Display’, serif;
font-size: 0.9rem;
letter-spacing: 0.15em;
color: rgba(245,234,216,.4);
text-transform: uppercase;
margin-bottom: 16px;
}

.round-bar span { color: var(–tile-shadow); }

/* Winner modal */
#winner-modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,.8);
z-index: 100;
align-items: center;
justify-content: center;
padding: 20px;
}
#winner-modal.show { display: flex; }

.modal-card {
background: var(–wood);
border: 2px solid var(–tile);
border-radius: 6px;
padding: 40px 48px;
text-align: center;
max-width: 380px;
width: 100%;
box-shadow: 0 0 60px rgba(192,160,80,.3);
animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
}

@keyframes popIn {
from { transform: scale(.7); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}

.winner-crown { font-size: 3.5rem; margin-bottom: 10px; }

.modal-card h2 {
font-family: ‘Playfair Display’, serif;
font-size: 1rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: rgba(245,234,216,.5);
margin-bottom: 8px;
}

.winner-name {
font-family: ‘Playfair Display’, serif;
font-size: 2.8rem;
font-weight: 900;
color: var(–tile);
margin-bottom: 6px;
}

.winner-score {
font-size: 1.2rem;
color: rgba(245,234,216,.65);
margin-bottom: 28px;
}

.modal-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* Scoreboard final */
.final-standings {
margin-bottom: 24px;
}
.standing-row {
display: flex;
justify-content: space-between;
padding: 6px 0;
border-bottom: 1px solid rgba(122,92,58,.2);
font-size: 1.05rem;
}
.standing-row .pos { color: rgba(245,234,216,.4); width: 24px; }
.standing-row .sname { flex: 1; padding-left: 10px; }
.standing-row .sscore { font-weight: 600; color: var(–tile); }

/* TIMER */
.timer-wrap {
display: flex;
align-items: center;
justify-content: center;
gap: 18px;
background: var(–wood);
border: 2px solid var(–border);
border-radius: 4px;
padding: 16px 24px;
margin-bottom: 16px;
box-shadow: 0 4px 16px rgba(0,0,0,.4);
transition: border-color .3s, box-shadow .3s;
}

.timer-wrap.warning {
border-color: #c0392b;
box-shadow: 0 4px 24px rgba(192,57,43,.4);
}

.timer-display {
font-family: ‘Playfair Display’, serif;
font-size: 3.2rem;
font-weight: 900;
color: var(–cream);
letter-spacing: 0.05em;
min-width: 90px;
text-align: center;
transition: color .3s;
line-height: 1;
}

.timer-display.warning { color: #e74c3c; }

.timer-ring {
position: relative;
width: 56px;
height: 56px;
flex-shrink: 0;
}

.timer-ring svg {
transform: rotate(-90deg);
width: 56px;
height: 56px;
}

.timer-ring circle.track {
fill: none;
stroke: rgba(122,92,58,.3);
stroke-width: 4;
}

.timer-ring circle.progress {
fill: none;
stroke: var(–tile);
stroke-width: 4;
stroke-linecap: round;
stroke-dasharray: 150.8;
stroke-dashoffset: 0;
transition: stroke-dashoffset .9s linear, stroke .3s;
}

.timer-ring circle.progress.warning { stroke: #e74c3c; }

.timer-ring .ring-icon {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.4rem;
}

.timer-btns {
display: flex;
flex-direction: column;
gap: 8px;
}

.btn-timer {
background: rgba(0,0,0,.3);
border: 1px solid var(–border);
border-radius: 3px;
color: rgba(245,234,216,.7);
font-family: ‘Crimson Text’, serif;
font-size: 0.85rem;
letter-spacing: 0.06em;
padding: 5px 14px;
cursor: pointer;
transition: border-color .15s, color .15s;
white-space: nowrap;
}
.btn-timer:hover { border-color: var(–tile-shadow); color: var(–cream); }

.timer-expired-banner {
display: none;
background: #c0392b;
color: #fff;
text-align: center;
font-family: ‘Playfair Display’, serif;
font-size: 0.85rem;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
padding: 5px 12px;
border-radius: 3px;
animation: pulse 0.6s ease-in-out infinite alternate;
}
.timer-expired-banner.show { display: inline-block; }

@keyframes pulse {
from { opacity: 1; }
to   { opacity: 0.5; }
}

@keyframes shake {
0%,100% { transform: translateX(0); }
20%     { transform: translateX(-6px); }
40%     { transform: translateX(6px); }
60%     { transform: translateX(-4px); }
80%     { transform: translateX(4px); }
}
.timer-wrap.shake { animation: shake 0.4s ease; }

@media (max-width: 500px) {
.scoreboard { grid-template-columns: 1fr 1fr; }
.modal-card { padding: 28px 24px; }
.timer-display { font-size: 2.4rem; }
}
</style>

</head>
<body>

<h1>Scrabble</h1>
<p class="subtitle">Family Scoreboard</p>

<!-- SETUP SCREEN -->

<div id="setup-screen">
  <div class="setup-card">
    <h2>Set Turn Order</h2>
    <p class="drag-hint">Drag to reorder — first is first</p>
    <ul class="order-list" id="order-list">
      <li class="order-item" draggable="true" data-player="Mom">
        <span class="order-num">1</span>
        <span class="order-name">Mom</span>
        <span style="color:rgba(245,234,216,.2);font-size:1.2rem">⠿</span>
      </li>
      <li class="order-item" draggable="true" data-player="Dad">
        <span class="order-num">2</span>
        <span class="order-name">Dad</span>
        <span style="color:rgba(245,234,216,.2);font-size:1.2rem">⠿</span>
      </li>
      <li class="order-item" draggable="true" data-player="Son">
        <span class="order-num">3</span>
        <span class="order-name">Son</span>
        <span style="color:rgba(245,234,216,.2);font-size:1.2rem">⠿</span>
      </li>
      <li class="order-item" draggable="true" data-player="Daughter">
        <span class="order-num">4</span>
        <span class="order-name">Daughter</span>
        <span style="color:rgba(245,234,216,.2);font-size:1.2rem">⠿</span>
      </li>
    </ul>
    <button class="btn-start" onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- GAME SCREEN -->

<div id="game-screen">
  <div class="round-bar">Round <span id="round-num">1</span> &nbsp;·&nbsp; Turn <span id="turn-num">1</span></div>

  <div class="scoreboard" id="scoreboard"></div>

  <!-- TIMER -->

  <div class="timer-wrap" id="timer-wrap">
    <div class="timer-ring">
      <svg viewBox="0 0 56 56">
        <circle class="track" cx="28" cy="28" r="24"/>
        <circle class="progress" id="timer-ring-progress" cx="28" cy="28" r="24"/>
      </svg>
      <div class="ring-icon">⏱</div>
    </div>
    <div>
      <div class="timer-display" id="timer-display">1:00</div>
      <div style="text-align:center;margin-top:3px;">
        <span class="timer-expired-banner" id="timer-expired">TIME'S UP!</span>
      </div>
    </div>
    <div class="timer-btns">
      <button class="btn-timer" onclick="resetTimer()">Reset</button>
      <button class="btn-timer" id="pause-btn" onclick="togglePause()">Pause</button>
    </div>
  </div>

  <div class="input-area" id="input-area">
    <h3 id="input-label">Enter Score</h3>
    <div class="input-row">
      <div class="input-group">
        <label>Points this turn</label>
        <input type="number" class="score-input" id="score-input" placeholder="0" min="-999" max="999"
          onkeydown="if(event.key==='Enter') addScore()">
      </div>
      <button class="btn-add" onclick="addScore()">Add ＋</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-secondary" onclick="endGame()">End Game &amp; See Results</button>
    <button class="btn-secondary btn-danger" onclick="newGame()">New Game</button>
  </div>
</div>

<!-- WINNER MODAL -->

<div id="winner-modal">
  <div class="modal-card">
    <div class="winner-crown">👑</div>
    <h2>Winner</h2>
    <div class="winner-name" id="winner-name"></div>
    <div class="winner-score" id="winner-score"></div>
    <div class="final-standings" id="final-standings"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="newGame()">New Game</button>
      <button class="btn-add" onclick="closeModal()">Keep Playing</button>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────
  let players = [];       // ordered array of names
  let scores = {};        // { name: [ {round, pts} ] }
  let currentTurn = 0;    // index into players
  let round = 1;
  let turnInRound = 0;    // how many turns taken this round

  // ── Drag-to-reorder setup ──────────────────────────────────────────
  const orderList = document.getElementById('order-list');
  let dragSrc = null;

  orderList.addEventListener('dragstart', e => {
    dragSrc = e.target.closest('.order-item');
    dragSrc.style.opacity = '0.45';
  });
  orderList.addEventListener('dragend', e => {
    document.querySelectorAll('.order-item').forEach(el => {
      el.style.opacity = '';
      el.classList.remove('drag-over');
    });
    refreshNumbers();
  });
  orderList.addEventListener('dragover', e => {
    e.preventDefault();
    const target = e.target.closest('.order-item');
    if (target && target !== dragSrc) {
      document.querySelectorAll('.order-item').forEach(el => el.classList.remove('drag-over'));
      target.classList.add('drag-over');
    }
  });
  orderList.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.order-item');
    if (target && target !== dragSrc) {
      const items = [...orderList.children];
      const srcIdx = items.indexOf(dragSrc);
      const tgtIdx = items.indexOf(target);
      if (srcIdx < tgtIdx) orderList.insertBefore(dragSrc, target.nextSibling);
      else orderList.insertBefore(dragSrc, target);
    }
  });

  function refreshNumbers() {
    document.querySelectorAll('.order-item').forEach((el, i) => {
      el.querySelector('.order-num').textContent = i + 1;
    });
  }

  // ── Start game ─────────────────────────────────────────────────────
  function startGame() {
    players = [...orderList.querySelectorAll('.order-item')]
      .map(el => el.dataset.player);
    scores = {};
    players.forEach(p => scores[p] = []);
    currentTurn = 0;
    round = 1;
    turnInRound = 0;

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    renderBoard();
    focusInput();
  }

  // ── Render scoreboard ──────────────────────────────────────────────
  function renderBoard() {
    document.getElementById('round-num').textContent = round;
    document.getElementById('turn-num').textContent = (round - 1) * players.length + turnInRound + 1;

    const board = document.getElementById('scoreboard');
    board.innerHTML = '';

    players.forEach((name, idx) => {
      const isActive = idx === currentTurn;
      const total = scores[name].reduce((s, e) => s + e.pts, 0);
      const card = document.createElement('div');
      card.className = 'player-card' + (isActive ? ' active-turn' : '');

      const histHTML = scores[name].length
        ? scores[name].map((e, i) =>
            `<div class="score-row">
              <span class="rnd">R${e.round}</span>
              <span class="pts ${e.pts >= 0 ? 'positive' : 'negative'}">${e.pts >= 0 ? '+' : ''}${e.pts}</span>
              <button class="undo-btn" onclick="removeScore('${name}',${i})" title="Remove">✕</button>
            </div>`
          ).join('')
        : '<div class="score-row" style="justify-content:center;color:rgba(245,234,216,.25);font-style:italic;font-size:.85rem;">No scores yet</div>';

      card.innerHTML = `
        <div class="turn-order-badge">${idx + 1}</div>
        <div class="player-name">${name}</div>
        <div class="player-total">${total}</div>
        <div class="score-history">${histHTML}</div>
      `;
      board.appendChild(card);
    });

    const activePlayer = players[currentTurn];
    document.getElementById('input-label').textContent = `${activePlayer}'s Score`;
  }

  // ── Add score ──────────────────────────────────────────────────────
  function addScore() {
    const input = document.getElementById('score-input');
    const val = parseInt(input.value, 10);
    if (isNaN(val)) { input.focus(); return; }

    const name = players[currentTurn];
    scores[name].push({ round, pts: val });

    // Advance turn
    turnInRound++;
    currentTurn = (currentTurn + 1) % players.length;
    if (currentTurn === 0) { round++; turnInRound = 0; }

    input.value = '';
    renderBoard();
    focusInput();

    // Scroll active card into view on mobile
    const cards = document.querySelectorAll('.player-card');
    if (cards[currentTurn]) cards[currentTurn].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Remove a score entry ───────────────────────────────────────────
  function removeScore(name, idx) {
    scores[name].splice(idx, 1);
    renderBoard();
  }

  // ── End game ───────────────────────────────────────────────────────
  function endGame() {
    const totals = players.map(p => ({ name: p, score: scores[p].reduce((s, e) => s + e.pts, 0) }));
    totals.sort((a, b) => b.score - a.score);

    const winner = totals[0];
    document.getElementById('winner-name').textContent = winner.name;
    document.getElementById('winner-score').textContent = `${winner.score} points`;

    const standingsEl = document.getElementById('final-standings');
    standingsEl.innerHTML = totals.map((t, i) =>
      `<div class="standing-row">
        <span class="pos">${i + 1}.</span>
        <span class="sname">${t.name}</span>
        <span class="sscore">${t.score}</span>
      </div>`
    ).join('');

    document.getElementById('winner-modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('winner-modal').classList.remove('show');
  }

  // ── New game ───────────────────────────────────────────────────────
  function newGame() {
    closeModal();
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'block';
  }

  function focusInput() {
    setTimeout(() => document.getElementById('score-input')?.focus(), 50);
  }
</script>

</body>
</html>
